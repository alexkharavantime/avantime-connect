name: Windows client
on:
  push:
    branches: [feature/windows-client]
    paths: ['windows-client/**', '.github/workflows/windows-client.yml']
  pull_request:
    paths: ['windows-client/**', '.github/workflows/windows-client.yml']
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Build WPF client and checks
        run: dotnet build windows-client/AvantimeConnect.sln -c Release --nologo
      - name: Check enrollment and Windows protected storage
        run: dotnet run --project windows-client/tests/AvantimeConnect.Checks -c Release --no-build
      - name: Install official WireGuard on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'wireguard-amd64-1.1.1.msi'
          Invoke-WebRequest 'https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi' -OutFile $msi
          $signature = Get-AuthenticodeSignature $msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'WireGuard LLC') {
            throw 'WireGuard installer signature is not valid for the expected publisher'
          }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'DO_NOT_LAUNCH=1') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "WireGuard installation failed: $($install.ExitCode)" }
      - name: Check encrypted LocalSystem tunnel on disposable runner
        run: dotnet run --project windows-client/tests/AvantimeConnect.Checks -c Release --no-build -- --tunnel-smoke
